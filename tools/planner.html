<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>升学路线规划器｜升学路线图</title><link rel="stylesheet" href="../styles.css"></head><body>
<header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">路</span><span>升学路线图</span></a><nav><a href="../index.html#knowledge">知识库</a><a href="index.html">实用工具</a><a href="../sources.html">官方资料库</a></nav><a class="github-link" href="../index.html">返回首页 ↗</a></header>
<section class="page-hero"><div class="breadcrumb"><a href="../index.html">首页</a> / <a href="index.html">实用工具</a> / 路线规划器</div><p class="eyebrow">PATHWAY PLANNER</p><h1>升学路线规划器</h1><p>先梳理目标与限制，再列出需要官方核验的问题。它不会预测录取结果。</p></section>
<div class="form-shell"><form class="tool-form" id="plannerForm"><div class="form-grid">
<label>当前阶段<select id="stage" required><option value="">请选择</option><option>学前 / 小学</option><option>初中</option><option>高中 / 中职</option><option>专科</option><option>本科</option><option>硕士</option><option>已工作 / 其他</option></select></label>
<label>目标<select id="goal" required><option value="">请选择</option><option>继续国内升学</option><option>申请海外学校</option><option>提升学历 / 转专业</option><option>职业技能与就业</option><option>还不确定</option></select></label>
<label>预算偏好<select id="budget" required><option value="">请选择</option><option>预算有限，优先低成本</option><option>有一定储蓄</option><option>可承担较高教育费用</option><option>暂未确定</option></select></label>
<label>预计准备时间<select id="time" required><option value="">请选择</option><option>6 个月以内</option><option>6–12 个月</option><option>1–3 年</option><option>3 年以上</option></select></label>
<label>目标地区（可选）<input id="region" placeholder="例如：所在省份 / 西班牙 / 暂未确定"></label>
<label>每周可投入时间（小时）<input id="hours" type="number" min="0" max="100" placeholder="例如：5"></label></div><button class="button primary full-width" type="submit">生成路线建议 →</button><div class="result-panel" id="result" hidden></div></form></div>
<script>
document.getElementById('plannerForm').addEventListener('submit',e=>{e.preventDefault();const stage=document.getElementById('stage').value,goal=document.getElementById('goal').value,budget=document.getElementById('budget').value,time=document.getElementById('time').value,region=document.getElementById('region').value||'待确定',hours=document.getElementById('hours').value||'待确定';let advice='列出至少两条候选路线，比较资格、总时间、总费用、证书和下一阶段出口。';if(goal==='申请海外学校')advice='先向目标学校书面核实现有学历是否符合入学资格，再核对语言成绩、材料认证、申请截止日期、签证与资金要求。不要仅凭中介宣传判断。';if(goal==='继续国内升学')advice='查阅所在地当年教育主管部门、考试机构与目标学校发布的正式招生政策，确认报名资格、考试科目、时间节点和材料要求。';if(goal==='提升学历 / 转专业')advice='先确定目标证书类型和用途，核对招生主体、学习形式、考试要求、费用、学制及后续升学资格。';if(budget.includes('有限'))advice+=' 预算有限时，优先比较公办项目、奖助学金、低成本地区和分阶段计划。';const r=document.getElementById('result');r.innerHTML='<h2>你的初步路线摘要</h2><p><b>当前阶段：</b>'+stage+'　<b>目标：</b>'+goal+'</p><p><b>目标地区：</b>'+region+'　<b>准备周期：</b>'+time+'　<b>每周时间：</b>'+hours+' 小时</p><p>'+advice+'</p><h3>建议下一步</h3><ol><li>记录目标学校/项目与申请年份。</li><li>保存官方招生要求链接，记录核验日期。</li><li>建立费用表与时间线，并准备至少一条备选路线。</li></ol><p><b>提醒：</b>此结果为一般信息整理，不构成录取判断；具体条件需按地区、年份和学校核实。</p>';r.hidden=false;});
</script></body></html>
