<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="创建、保存和打印个人升学申请清单。"><title>申请清单｜升学路线图</title><link rel="stylesheet" href="../styles.css">
<style>
@media print{body{background:#fff}.topbar,.page-hero,.no-print,footer,.privacy-note{display:none!important}.form-shell{max-width:none;margin:0;padding:0}.tool-form{border:0;box-shadow:none;padding:0}.task-item{break-inside:avoid}.task-list{gap:5px}.task-item{border-color:#ccc;padding:8px}.print-heading{display:block!important}}
.print-heading{display:none}
</style></head>
<body>
<header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">路</span><span>升学路线图</span></a><nav><a href="../index.html#knowledge">知识库</a><a href="index.html">实用工具</a><a href="../sources.html">官方资料库</a></nav><a class="github-link" href="../index.html">返回首页 ↗</a></header>
<section class="page-hero"><div class="breadcrumb"><a href="../index.html">首页</a> / <a href="index.html">实用工具</a> / 申请清单</div><p class="eyebrow">CHECKLIST & TIMELINE</p><h1>我的升学准备清单</h1><p>勾选完成事项、添加个人任务，并将清单保存在当前浏览器中。打印功能可用于纸质跟进或保存为 PDF。</p></section>
<main class="form-shell"><div class="tool-form">
<div class="print-heading"><h1>升学准备清单</h1><p id="printMeta"></p></div>
<label>目标项目或学校<input id="projectName" maxlength="200" placeholder="例如：2028 年申请某大学本科"></label>
<label style="margin-top:16px">计划截止日期<input id="deadline" type="date"></label>
<div class="task-list" id="taskList"></div>
<div class="form-grid no-print" style="margin-top:18px"><label>添加自定义任务<input id="customTask" maxlength="300" placeholder="例如：向招生办确认学历要求"></label><div style="display:flex;align-items:end"><button class="button secondary" id="addTask" type="button">添加任务 +</button></div></div>
<div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="button primary" type="button" id="printButton">打印 / 保存为 PDF ↗</button><button class="button secondary" type="button" id="resetChecks">取消所有勾选</button><button class="button secondary" type="button" id="resetAll">恢复默认清单</button></div>
<p class="privacy-note" id="saveStatus" aria-live="polite">清单会保存在此浏览器的本地存储中，不会上传到网站。清除浏览器数据可能导致本地记录丢失。</p>
</div></main>
<footer><a class="brand" href="../index.html"><span class="brand-mark">路</span><span>升学路线图</span></a><p>独立的公共教育信息项目 · 非官方招生机构</p><div><a href="../README.md">项目说明</a><a href="../sources.html">资料来源</a><a href="../CONTENT-LICENSE.md">内容许可</a></div><small>请在重要决定前核实官方最新信息。</small></footer>
<script>
const defaults=['明确目标学历、专业、国家或地区','确认招生主体与项目资质','查阅当年官方招生简章','向招生单位核实个人资格','记录申请截止日期与考试日期','准备成绩单、学历证明和身份材料','确认语言成绩及有效期','核实翻译、公证或认证要求','完成学费、生活费和应急预算','核对签证、保险与住宿要求','准备备选项目和延迟计划','保存来源链接与核验日期'];
const storageKey='education-pathway-checklist-v1';
const list=document.getElementById('taskList'),status=document.getElementById('saveStatus');
let tasks=defaults.map((text,i)=>({id:'d'+i,text,done:false}));
let project='',deadline='';
function makeId(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function render(){
 list.replaceChildren();
 tasks.forEach(task=>{
  const label=document.createElement('label');label.className='task-item';
  const box=document.createElement('input');box.type='checkbox';box.checked=task.done;box.setAttribute('aria-label','完成：'+task.text);
  box.addEventListener('change',()=>{task.done=box.checked;save();});
  const span=document.createElement('span');span.textContent=task.text+(task.custom?'（自定义）':'');
  label.append(box,span);
  if(task.custom){const remove=document.createElement('button');remove.type='button';remove.className='no-print';remove.textContent='删除';remove.style.marginLeft='auto';remove.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render()});label.append(remove)}
  list.append(label);
 });
}
function save(){
 project=document.getElementById('projectName').value;
 deadline=document.getElementById('deadline').value;
 try{localStorage.setItem(storageKey,JSON.stringify({tasks,project,deadline}));status.textContent='已保存在此浏览器。清除浏览器数据可能导致记录丢失。';}
 catch(e){status.textContent='当前浏览器未能保存本地记录；请使用打印 / 保存为 PDF 留存。';}
 document.getElementById('printMeta').textContent=(project?'目标：'+project+'　':'')+(deadline?'计划截止日期：'+deadline:'');
}
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&Array.isArray(saved.tasks)&&saved.tasks.every(t=>typeof t.text==='string'&&typeof t.done==='boolean')){tasks=saved.tasks;project=typeof saved.project==='string'?saved.project:'';deadline=typeof saved.deadline==='string'?saved.deadline:'';}}
catch(e){}
document.getElementById('projectName').value=project;document.getElementById('deadline').value=deadline;
document.getElementById('projectName').addEventListener('input',save);document.getElementById('deadline').addEventListener('change',save);
document.getElementById('addTask').addEventListener('click',()=>{const input=document.getElementById('customTask'),text=input.value.trim();if(!text)return;tasks.push({id:makeId(),text,done:false,custom:true});input.value='';save();render();});
document.getElementById('resetChecks').addEventListener('click',()=>{tasks.forEach(t=>t.done=false);save();render();});
document.getElementById('resetAll').addEventListener('click',()=>{if(!confirm('恢复默认清单会清除当前自定义任务和勾选，确定继续吗？'))return;tasks=defaults.map((text,i)=>({id:'d'+i,text,done:false}));document.getElementById('projectName').value='';document.getElementById('deadline').value='';save();render();});
document.getElementById('printButton').addEventListener('click',()=>{save();window.print()});
render();save();
</script>
</body></html>
