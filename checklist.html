<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>申请清单｜升学路线图</title><link rel="stylesheet" href="../styles.css"><style>@media print{.topbar,.page-hero,.no-print,footer{display:none!important}.task-item{break-inside:avoid}.form-shell{margin:0 auto;padding:0}.result-panel{display:block!important;box-shadow:none;border:0}}</style></head><body>
<header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">路</span><span>升学路线图</span></a><nav><a href="../index.html#knowledge">知识库</a><a href="index.html">实用工具</a><a href="../sources.html">官方资料库</a></nav><a class="github-link" href="../index.html">返回首页 ↗</a></header>
<section class="page-hero"><div class="breadcrumb"><a href="../index.html">首页</a> / <a href="index.html">实用工具</a> / 申请清单</div><p class="eyebrow">CHECKLIST & TIMELINE</p><h1>我的升学准备清单</h1><p>勾选完成事项，添加自己的任务。点击打印可保存为 PDF。此初版不在不同设备间自动同步进度。</p></section>
<div class="form-shell"><div class="tool-form"><label>目标项目或学校<input id="projectName" placeholder="例如：2028 年申请某大学本科"></label><label style="margin-top:16px">计划截止日期<input id="deadline" type="date"></label><div class="task-list" id="taskList"></div><div class="form-grid no-print" style="margin-top:18px"><label>添加自定义任务<input id="customTask" placeholder="例如：向招生办确认学历要求"></label><div style="display:flex;align-items:end"><button class="button secondary" id="addTask" type="button">添加任务 +</button></div></div><div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="button primary" type="button" onclick="window.print()">打印 / 保存为 PDF ↗</button><button class="button secondary" type="button" id="clearTasks">取消所有勾选</button></div><p class="privacy-note">任务与勾选仅保存在当前页面会话中；打印后可自行保存。不要在公共设备上输入隐私信息。</p></div></div>
<script>
const defaults=['明确目标学历、专业、国家或地区','确认招生主体与项目资质','查阅当年官方招生简章','向招生单位核实个人资格','记录申请截止日期与考试日期','准备成绩单、学历证明和身份材料','确认语言成绩及有效期','核实翻译、公证或认证要求','完成学费、生活费和应急预算','核对签证、保险与住宿要求','准备备选项目和延迟计划','保存来源链接与核验日期'];
const list=document.getElementById('taskList');
function addTask(text){const label=document.createElement('label');label.className='task-item';const box=document.createElement('input');box.type='checkbox';const span=document.createElement('span');span.textContent=text;label.append(box,span);list.append(label)}
defaults.forEach(addTask);
document.getElementById('addTask').addEventListener('click',()=>{const input=document.getElementById('customTask');if(input.value.trim()){addTask(input.value.trim());input.value='';}});
document.getElementById('clearTasks').addEventListener('click',()=>list.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false));
</script></body></html>
